name: Deploy

# Builds the text library and deploys the Worker and site to Cloudflare. It only runs when
# someone starts it by hand (Actions tab, then Deploy, then Run workflow), never on a push.
# Repository secrets: CLOUDFLARE_API_TOKEN (needs edit rights for Workers, D1 and R2)
# and CLOUDFLARE_ACCOUNT_ID.
# Optional repository variable: SITE_URL (defaults to https://orbitdodge.com).
on:
  workflow_dispatch:

concurrency:
  group: deploy
  # Let a running deploy finish instead of cutting it off halfway.
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SITE_URL: ${{ vars.SITE_URL || 'https://orbitdodge.com' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Cache downloaded source files
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: library-${{ hashFiles('scripts/build-*.mjs', 'catalog*.js') }}-${{ github.run_id }}
          restore-keys: |
            library-${{ hashFiles('scripts/build-*.mjs', 'catalog*.js') }}-
            library-
      - name: Build the text library
        run: npm run build:texts && npm run build:dapim && npm run build:titles && npm run build:review-index && node scripts/build-calendar.mjs --snapshot
      - name: Save downloaded source files (even if a later step fails)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: library-${{ hashFiles('scripts/build-*.mjs', 'catalog*.js') }}-${{ github.run_id }}
      - name: Verify the library (fails the deploy if any title would 404)
        run: npm run verify
      - run: npm run build:site
      - name: Apply database migrations
        run: npx wrangler d1 migrations apply orbitdodge-mercava --remote
      - name: Deploy the Worker
        run: npx wrangler deploy
      # The upload route is only open while this one-off random key exists;
      # the next step removes it even if the upload fails.
      - name: Upload the site files to R2 (temporary upload key)
        run: |
          KEY=$(openssl rand -hex 32)
          echo "::add-mask::$KEY"
          printf '%s' "$KEY" | npx wrangler secret put UPLOAD_KEY
          UPLOAD_KEY="$KEY" npm run upload
      - name: Close the upload route again
        if: always()
        run: echo y | npx wrangler secret delete UPLOAD_KEY || true
      - name: Verify the deployed host serves every file
        run: node scripts/verify-library.mjs --base="$SITE_URL"
